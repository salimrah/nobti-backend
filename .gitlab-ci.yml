stages:
  - secret-scan
  - build
  - test
  - docker
  - deploy-staging
  - deploy-production

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/noba"
  SPRING_DATASOURCE_USERNAME: "test"
  SPRING_DATASOURCE_PASSWORD: "test"
  SPRING_DATA_REDIS_URL: "redis://redis:6379"
  DOCKER_IMAGE: "${CI_REGISTRY_IMAGE:-$CI_REGISTRY/noba/noba-backend}"
  DOCKER_TAG: "${CI_COMMIT_SHA}"

cache:
  key: "${CI_COMMIT_REF_SLUG}-maven"
  paths:
    - .m2/repository

secret-scan:
  stage: secret-scan
  image:
    name: ghcr.io/gitleaks/gitleaks:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - gitleaks detect --source . --config .gitleaks.toml --redact --verbose
  rules:
    - when: always

build:
  stage: build
  image: eclipse-temurin:21-jdk-alpine
  script:
    - chmod +x ./mvnw
    - ./mvnw clean compile -DskipTests $MAVEN_OPTS
  rules:
    - when: always

test:
  stage: test
  image: eclipse-temurin:21-jdk-alpine
  services:
    - name: postgres:16
      alias: postgres
    - name: redis:7
      alias: redis
  variables:
    POSTGRES_DB: "noba"
    POSTGRES_USER: "test"
    POSTGRES_PASSWORD: "test"
  script:
    - chmod +x ./mvnw
    - ./mvnw test $MAVEN_OPTS
  rules:
    - when: always

docker:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker info
  script:
    - chmod +x ./mvnw
    - ./mvnw clean package -DskipTests $MAVEN_OPTS
    - |
      if [ -n "$CI_REGISTRY_USER" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
        docker build -t "$DOCKER_IMAGE:$DOCKER_TAG" -t "$DOCKER_IMAGE:latest" .
        docker push "$DOCKER_IMAGE:$DOCKER_TAG"
        docker push "$DOCKER_IMAGE:latest"
      else
        echo "Skipping Docker push — CI_REGISTRY_USER not set"
        docker build -t noba-backend:test .
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always

deploy-staging:
  stage: deploy-staging
  image: alpine:latest
  environment: staging
  before_script:
    - apk add --no-cache openssh-client curl bash
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$STAGING_SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      set -e
      ssh "$STAGING_SERVER_USER@$STAGING_SERVER_HOST" "docker pull $DOCKER_IMAGE:latest"
      ssh "$STAGING_SERVER_USER@$STAGING_SERVER_HOST" << 'ENDSSH'
        cd /opt/noba
        if [ -f "docker-compose.staging.yml" ]; then
          DOCKER_IMAGE="${DOCKER_IMAGE}" SPRING_PROFILES_ACTIVE=staging \
          docker compose -f docker-compose.staging.yml up -d --no-deps noba-backend
        elif [ -f "docker-compose.app-only.yml" ]; then
          DOCKER_IMAGE="${DOCKER_IMAGE}" SPRING_PROFILES_ACTIVE=staging \
          docker compose -f docker-compose.app-only.yml up -d --no-deps noba-backend
        fi
      ENDSSH
      for i in $(seq 1 30); do
        if ssh "$STAGING_SERVER_USER@$STAGING_SERVER_HOST" "curl -sf http://localhost:8080/actuator/health" > /dev/null 2>&1; then
          echo "Staging health check passed after $((i * 2)) seconds"
          break
        fi
        if [ "$i" -eq 30 ]; then exit 1; fi
        sleep 2
      done
    - |
      chmod +x ./scripts/smoke-test.sh
      ./scripts/smoke-test.sh "http://$STAGING_SERVER_HOST:8080" 30 && SMOKE_PASS=true || SMOKE_PASS=false
      if [ "$SMOKE_PASS" = "false" ]; then
        echo "Staging smoke tests failed — rollback not automated for staging"
        echo "Manual investigation required"
        exit 1
      fi
    - |
      if command -v k6 &> /dev/null; then
        ./scripts/run-load-tests.sh "http://$STAGING_SERVER_HOST:8080" smoke
      else
        echo "k6 not installed — skipping load tests"
      fi
    - |
      curl -sf -X POST -H "Content-type: application/json" \
        --data "{\"text\":\"✅ *Staging deploy succeeded* for \`noba-backend\`\nCommit: $CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA\"}" \
        "${SLACK_WEBHOOK_URL:-}" || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always

deploy-production:
  stage: deploy-production
  image: alpine:latest
  environment: production
  before_script:
    - apk add --no-cache openssh-client curl bash
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    # ── Step 1: Deploy new version ──
    - |
      set -e
      echo "=== Pulling latest Docker image ==="
      ssh "$SERVER_USER@$SERVER_HOST" "docker pull $DOCKER_IMAGE:latest"

      echo "=== Deploying with Docker Compose ==="
      ssh "$SERVER_USER@$SERVER_HOST" << 'ENDSSH'
        cd /opt/noba

        if [ -f "docker-compose.app-only.yml" ]; then
          echo "Using app-only compose (external DB/Redis)"
          DOCKER_IMAGE="${DOCKER_IMAGE}" docker compose -f docker-compose.app-only.yml up -d --no-deps noba-backend
        elif [ -f "docker-compose.prod.yml" ]; then
          echo "Using full-stack compose (app + DB + Redis)"
          DOCKER_IMAGE="${DOCKER_IMAGE}" docker compose -f docker-compose.prod.yml up -d --no-deps noba-backend
        else
          echo "ERROR: No docker-compose file found on server!"
          exit 1
        fi
      ENDSSH

      echo "=== Waiting for health check ==="
      for i in $(seq 1 30); do
        if ssh "$SERVER_USER@$SERVER_HOST" "curl -sf http://localhost:8080/actuator/health" > /dev/null 2>&1; then
          echo "Health check passed after $((i * 2)) seconds"
          break
        fi
        if [ "$i" -eq 30 ]; then
          echo "ERROR: Health check failed after 60 seconds"
          ssh "$SERVER_USER@$SERVER_HOST" "curl -v http://localhost:8080/actuator/health || true"
          exit 1
        fi
        echo "Waiting... ($i/30)"
        sleep 2
      done

    # ── Step 2: Run smoke tests ──
    - |
      chmod +x ./scripts/smoke-test.sh
      ./scripts/smoke-test.sh "http://$SERVER_HOST:8080" 30 && SMOKE_PASS=true || SMOKE_PASS=false

    # ── Step 3: Auto-rollback if smoke tests failed ──
    - |
      if [ "$SMOKE_PASS" = "false" ]; then
        echo "========================================="
        echo " SMOKE TESTS FAILED — AUTO-ROLLBACK"
        echo "========================================="

        ssh "$SERVER_USER@$SERVER_HOST" << 'ENDSSH'
          set -e
          cd /opt/noba

          PREV_IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep 'noba-backend' \
            | grep -v 'latest' \
            | head -1)

          if [ -z "$PREV_IMAGE" ]; then
            echo "ERROR: No previous image found to rollback to"
            exit 1
          fi

          echo "Rolling back to: $PREV_IMAGE"
          docker pull "$PREV_IMAGE"

          PREV_NAME=$(echo "$PREV_IMAGE" | rev | cut -d: -f2- | rev)
          PREV_TAG=$(echo "$PREV_IMAGE" | rev | cut -d: -f1 | rev)

          if [ -f "docker-compose.app-only.yml" ]; then
            DOCKER_IMAGE="$PREV_NAME" DOCKER_TAG="$PREV_TAG" \
            docker compose -f docker-compose.app-only.yml up -d --no-deps noba-backend
          elif [ -f "docker-compose.prod.yml" ]; then
            DOCKER_IMAGE="$PREV_NAME" DOCKER_TAG="$PREV_TAG" \
            docker compose -f docker-compose.prod.yml up -d --no-deps noba-backend
          fi

          echo "=== Waiting for health check after rollback ==="
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Rollback health check passed after $((i * 2)) seconds"
              echo "========================================="
              echo " ROLLBACK COMPLETE — previous version is running"
              exit 0
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: Rollback health check also failed!"
              exit 1
            fi
            sleep 2
          done
        ENDSSH

        curl -sf -X POST -H "Content-type: application/json" \
          --data "{\"text\":\"⚠️ *Production rollback triggered* for \`noba-backend\`\nCommit: $CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA\"}" \
          "${SLACK_WEBHOOK_URL:-}" || true
        exit 1
      else
        echo "✅ Production deploy successful — all smoke tests passed"
        curl -sf -X POST -H "Content-type: application/json" \
          --data "{\"text\":\"✅ *Production deploy succeeded* for \`noba-backend\`\nCommit: $CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA\"}" \
          "${SLACK_WEBHOOK_URL:-}" || true
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
