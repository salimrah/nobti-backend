---
spring.config.activate.on-profile=prod

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/noba}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# HikariCP
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Redis
redis.enabled=true
spring.data.redis.url=${SPRING_DATA_REDIS_URL:redis://redis:6379}

# Quartz (JDBC for production)
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO

# Logging
logging.level.ma.noba=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# Flyway — disabled in prod. Migrations run separately BEFORE deploying new code.
# See scripts/migrate.sh
spring.flyway.enabled=false

# Sentry
sentry.dsn=${SENTRY_DSN:}
sentry.traces-sample-rate=${SENTRY_TRACE_RATE:0.1}
sentry.environment=production

# JWT (v2 — must be configured via env vars in production)
security.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL:3600}
security.jwt.refresh-token-ttl-days=${JWT_REFRESH_TOKEN_TTL:7}
security.jwt.issuer=${JWT_ISSUER}
security.jwt.key-rotation-hours=${JWT_KEY_ROTATION_HOURS:24}

# PII encryption key (must be set in production)
security.pii.secret-b64=${SECURITY_PII_SECRET_B64}

# App
app.base-url=${APP_BASE_URL}

# Rate Limiting
rate-limit.limits.default.maxRequests=${RATE_LIMIT_DEFAULT:100}
rate-limit.limits.default.windowSeconds=60
rate-limit.limits./api/v1/auth.maxRequests=${RATE_LIMIT_AUTH:20}
rate-limit.limits./api/v1/auth.windowSeconds=60
rate-limit.limits./api/v1/providers.maxRequests=100
rate-limit.limits./api/v1/providers.windowSeconds=60
rate-limit.limits./api/v1/providers.enabled=true

# Distributed Tracing (opt-in via env var)
management.tracing.enabled=${TRACING_ENABLED:false}
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.1}

# Request Size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.max-request-size=10MB

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# Readiness reflects the dependencies needed to serve traffic (not optional integrations).
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.endpoint.health.group.readiness.show-details=never
