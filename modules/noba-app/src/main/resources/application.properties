spring.application.name=noba-backend
spring.messages.basename=messages

# Load local .env (git-ignored) for development. Optional so prod (real env vars) is unaffected.
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/noba}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Hibernate 2nd-Level Cache (Caffeine via JCache)
spring.jpa.properties.hibernate.cache.use_second_level_cache=${HIBERNATE_2LC_ENABLED:true}
spring.jpa.properties.hibernate.cache.region.factory_class=jcache
spring.jpa.properties.hibernate.javax.cache.provider=com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider
spring.jpa.properties.hibernate.cache.use_query_cache=${HIBERNATE_QUERY_CACHE_ENABLED:false}
spring.jpa.properties.hibernate.cache.missing_cache_strategy=create

# HikariCP Connection Pooling
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# Read-Replica Datasource (optional — routes read-only transactions to replica)
# Set READ_REPLICA_DATASOURCE_URL to enable. Replicas are auto-disconnected on failover.
app.datasource.replica.url=${READ_REPLICA_DATASOURCE_URL:}
app.datasource.replica.username=${READ_REPLICA_DATASOURCE_USERNAME:}
app.datasource.replica.password=${READ_REPLICA_DATASOURCE_PASSWORD:}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Redis
redis.enabled=true
spring.data.redis.url=${SPRING_DATA_REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=5000ms

# JWT (v2 — primary)
security.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL:36000000}
security.jwt.refresh-token-ttl-days=${JWT_REFRESH_TOKEN_TTL:7}
security.jwt.issuer=${JWT_ISSUER:https://api.noba.ma}
security.jwt.key-rotation-hours=${JWT_KEY_ROTATION_HOURS:24}
security.jwt.key-store-path=${JWT_KEY_STORE_PATH:${java.io.tmpdir}/noba-jwt-keys.json}
security.jwt.rsa-private-key=${JWT_RSA_PRIVATE_KEY:}
security.jwt.rsa-public-key=${JWT_RSA_PUBLIC_KEY:}
security.jwt.max-active-sessions=${JWT_MAX_ACTIVE_SESSIONS:10}
security.jwt.idle-timeout-days=${JWT_IDLE_TIMEOUT_DAYS:30}

# PII encryption key (AES-GCM, 32-byte base64) — REQUIRED, no insecure default
# Local value lives in .env / application-dev.properties
security.pii.secret-b64=${SECURITY_PII_SECRET_B64}

# Google OAuth
oauth.google.client-id=${OAUTH_GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET:}

# Facebook OAuth
oauth.facebook.client-id=${OAUTH_FACEBOOK_CLIENT_ID:}
oauth.facebook.client-secret=${OAUTH_FACEBOOK_CLIENT_SECRET:}

# Apple Sign-In
oauth.apple.client-id=${OAUTH_APPLE_CLIENT_ID:}
oauth.apple.team-id=${OAUTH_APPLE_TEAM_ID:}

# App
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Email (SMTP)
app.notification.provider=${NOTIFICATION_PROVIDER:log}
email.provider=${EMAIL_PROVIDER:log}
email.from=${EMAIL_FROM:noreply@noba.ma}
# spring.mail.host=${MAIL_HOST:smtp.gmail.com}
# spring.mail.port=${MAIL_PORT:587}
# spring.mail.username=${MAIL_USERNAME:}
# spring.mail.password=${MAIL_PASSWORD:}
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# Stripe
# Payment provider: stripe (default) or manual (cash/bank transfer, admin-managed payouts)
payment.gateway=${PAYMENT_GATEWAY:stripe}
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}

# Twilio
twilio.accountSid=${TWILIO_ACCOUNT_SID:}
twilio.authToken=${TWILIO_AUTH_TOKEN:}
otp.providers.sms.active=${OTP_SMS_PROVIDER:log}
otp.providers.sms.from=${TWILIO_SMS_FROM:+15017122661}
otp.providers.whatsapp.active=${OTP_WHATSAPP_PROVIDER:log}
otp.providers.whatsapp.from=${TWILIO_WHATSAPP_FROM:+14155238886}

# Quartz (memory for dev, jdbc for prod)
spring.quartz.job-store-type=${QUARTZ_JOB_STORE_TYPE:memory}
spring.quartz.auto-startup=true
spring.quartz.jdbc.initialize-schema=never

# RabbitMQ — credentials REQUIRED, no insecure default (local values in .env / application-dev.properties)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=${RABBITMQ_PUBLISHER_CONFIRM_TYPE:correlated}
spring.rabbitmq.publisher-returns=${RABBITMQ_PUBLISHER_RETURNS:true}

event.bus.rabbitmq.enabled=${EVENT_BUS_RABBITMQ_ENABLED:false}
event.outbox.enabled=${EVENT_OUTBOX_ENABLED:false}
event.rabbitmq.exchange=noba-events
event.rabbitmq.queue=noba-events-queue
event.rabbitmq.routing-key=#
event.rabbitmq.concurrency=2
event.rabbitmq.max-concurrency=10
event.rabbitmq.prefetch=10

# Queue notification settings
queue.notification.reminder-before-minutes=5
queue.notification.poll-interval-ms=60000

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
# RabbitMQ is optional (event bus disabled by default). Its health check must not mark the whole
# service DOWN when it is not deployed (compose/k8s run without RabbitMQ).
management.health.rabbit.enabled=${EVENT_BUS_RABBITMQ_ENABLED:false}

# Kubernetes Health Probes
management.server.port=${MANAGEMENT_SERVER_PORT:8080}

# Graceful shutdown
server.shutdown=graceful
# Honour X-Forwarded-* from a reverse proxy / load balancer (correct scheme, host, client IP).
server.forward-headers-strategy=framework
# Cross-instance lock for @Scheduled jobs (disabled in integration tests, which run create-drop).
shedlock.enabled=${SHEDLOCK_ENABLED:true}
spring.lifecycle.timeout-per-shutdown-phase=30s

# Request Timeouts (prevent thread starvation)
server.tomcat.connection-timeout=10000
server.tomcat.keep-alive-timeout=30000
spring.mvc.async.request-timeout=30000

# Logging
# HikariCP pool metrics
spring.datasource.hikari.metrics=true

logging.level.ma.noba=DEBUG
logging.level.org.springframework.security=INFO

# Rate Limiting
rate-limit.limits.default.maxRequests=${RATE_LIMIT_DEFAULT:100}
rate-limit.limits.default.windowSeconds=60
rate-limit.limits.default.enabled=true
rate-limit.limits./api/v1/auth.maxRequests=${RATE_LIMIT_AUTH:20}
rate-limit.limits./api/v1/auth.windowSeconds=60
rate-limit.limits./api/v1/auth.enabled=true
rate-limit.limits./api/v1/queues.maxRequests=60
rate-limit.limits./api/v1/queues.windowSeconds=60
rate-limit.limits./api/v1/queues.enabled=true
rate-limit.limits./api/v1/providers.maxRequests=100
rate-limit.limits./api/v1/providers.windowSeconds=60
rate-limit.limits./api/v1/providers.enabled=true

# Distributed Tracing (OpenTelemetry + Zipkin)
management.tracing.enabled=${TRACING_ENABLED:false}
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.max-request-size=10MB

# Sentry (Error Tracking)
sentry.dsn=${SENTRY_DSN:}
sentry.traces-sample-rate=1.0
sentry.environment=${SENTRY_ENVIRONMENT:development}
