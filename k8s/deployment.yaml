apiVersion: apps/v1
kind: Deployment
metadata:
  name: noba-backend
  labels:
    app: noba-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: noba-backend
  template:
    metadata:
      labels:
        app: noba-backend
    spec:
      serviceAccountName: noba-backend
      containers:
        - name: noba-backend
          image: noba-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: management
          envFrom:
            - configMapRef:
                name: noba-backend-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: noba-backend-secrets
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: noba-backend-secrets
                  key: db-password
            - name: JWT_KEY_ROTATION_HOURS
              valueFrom:
                secretKeyRef:
                  name: noba-backend-secrets
                  key: jwt-key-rotation-hours
            - name: SECURITY_PII_SECRET_B64
              valueFrom:
                secretKeyRef:
                  name: noba-backend-secrets
                  key: pii-secret
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: noba-backend-secrets
                  key: sentry-dsn
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: noba-backend-secrets
                  key: rabbitmq-username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: noba-backend-secrets
                  key: rabbitmq-password
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: noba-backend
  labels:
    app: noba-backend
