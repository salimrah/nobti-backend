apiVersion: v1
kind: Service
metadata:
  name: noba-backend
  labels:
    app: noba-backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: management
      port: 8081
      targetPort: 8081
      protocol: TCP
  selector:
    app: noba-backend
