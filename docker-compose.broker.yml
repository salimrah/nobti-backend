# Optional message broker (RabbitMQ).
# Only needed to test the cross-instance event transport or to run more than one
# application instance. The default local stack is broker-less (in-process events).
#
# Start: docker compose -f docker-compose.dev.yml -f docker-compose.broker.yml --profile broker up -d
# Stop:  docker compose -f docker-compose.dev.yml -f docker-compose.broker.yml --profile broker down
# App:   EVENT_BUS_RABBITMQ_ENABLED=true
services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: noba-rabbitmq-dev
    profiles: ["broker"]
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmqdata-dev:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmqdata-dev:
    driver: local
