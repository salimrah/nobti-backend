# Development — Local Machine (broker-less)
# Use when: Running locally for development.
#
# Modules talk through the in-process event bus; no message broker is required.
# Start:  docker compose -f docker-compose.dev.yml up -d
# Stop:   docker compose -f docker-compose.dev.yml down
#
# Need to exercise the RabbitMQ transport? Add the optional broker:
#   docker compose -f docker-compose.dev.yml -f docker-compose.broker.yml --profile broker up -d
#   EVENT_BUS_RABBITMQ_ENABLED=true ...

services:
  postgres:
    image: postgres:16-alpine
    container_name: noba-postgres-dev
    environment:
      POSTGRES_DB: noba
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: noba-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redisdata-dev:/data

  # Optional: Run app in container for dev testing
  # Usually you run `./mvnw spring-boot:run` directly on your machine instead
  # Uncomment below if you want to run the app in Docker for dev
  # noba-backend:
  #   build: .
  #   container_name: noba-backend-dev
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/noba
  #     SPRING_DATASOURCE_USERNAME: postgres
  #     SPRING_DATASOURCE_PASSWORD: postgres
  #     SPRING_DATA_REDIS_URL: redis://redis:6379
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_started

volumes:
  pgdata-dev:
    driver: local
  redisdata-dev:
    driver: local
