# Production — Full Stack
# Use when: Fresh VPS with no existing PostgreSQL or Redis
#
# Start:  docker compose -f docker-compose.prod.yml up -d
# Stop:   docker compose -f docker-compose.prod.yml down
#
# NOTE: .env file on server holds secrets (never committed):
#   DB_PASSWORD=your-secret
#   JWT_SECRET=your-jwt-secret-256bit-minimum
#   TWILIO_ACCOUNT_SID=...
#   TWILIO_AUTH_TOKEN=...

services:
  noba-backend:
    image: ${DOCKER_IMAGE:-noba-backend}:latest
    container_name: noba-backend
    restart: unless-stopped
    ports:
      # Bound to loopback: only the reverse proxy (Caddy) is exposed publicly.
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/noba
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?DB_USER must be set}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      SPRING_DATA_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      SECURITY_PII_SECRET_B64: ${SECURITY_PII_SECRET_B64}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-3600}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-7}
      JWT_KEY_ROTATION_HOURS: ${JWT_KEY_ROTATION_HOURS:-24}
      # Preferred: fixed keys (same across replicas/restarts). Falls back to the mounted key store.
      JWT_RSA_PRIVATE_KEY: ${JWT_RSA_PRIVATE_KEY:-}
      JWT_RSA_PUBLIC_KEY: ${JWT_RSA_PUBLIC_KEY:-}
      JWT_KEY_STORE_PATH: ${JWT_KEY_STORE_PATH:-/var/lib/noba/jwt-keys.json}
      SHEDLOCK_ENABLED: ${SHEDLOCK_ENABLED:-true}
      HIKARI_MAX_POOL_SIZE: "20"
      HIKARI_MIN_IDLE: "5"
      # External services (set in .env or leave empty to disable)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_FACEBOOK_CLIENT_ID: ${OAUTH_FACEBOOK_CLIENT_ID:-}
      OAUTH_FACEBOOK_CLIENT_SECRET: ${OAUTH_FACEBOOK_CLIENT_SECRET:-}
      OAUTH_APPLE_CLIENT_ID: ${OAUTH_APPLE_CLIENT_ID:-}
      OAUTH_APPLE_TEAM_ID: ${OAUTH_APPLE_TEAM_ID:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      TRACING_ENABLED: "${TRACING_ENABLED:-false}"
      ZIPKIN_ENDPOINT: ${ZIPKIN_ENDPOINT:-http://localhost:9411/api/v2/spans}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      # Fallback signing-key store when JWT_RSA_* is not provided.
      - jwtdata:/var/lib/noba
    networks:
      - noba-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    container_name: noba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: noba
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published: database is reachable only on the compose network.
    expose:
      - "5432"
    networks:
      - noba-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER must be set} -d noba"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: noba-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    expose:
      - "6379"
    networks:
      - noba-network

  # ─────────────────────────────────────────────────────────────────────────────
  # Reverse proxy + automatic TLS (Let's Encrypt).
  # Requires API_DOMAIN (A record → this host) and ACME_EMAIL.
  # ─────────────────────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: noba-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.noba.ma}
      ACME_EMAIL: ${ACME_EMAIL:-admin@noba.ma}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - noba-backend
    networks:
      - noba-network

  # ─────────────────────────────────────────────────────────────────────────────
  # Migration Service — runs Flyway migrations manually BEFORE deploying
  #
  # Usage:
  #   1. Build migration image:  docker compose build migration
  #   2. Run migration:          docker compose -f docker-compose.prod.yml run --rm migration
  #   3. Check logs for SUCCESS
  #   4. Deploy new app:         docker compose -f docker-compose.prod.yml up -d noba-backend
  # ─────────────────────────────────────────────────────────────────────────────
  migration:
    image: noba-backend-migration:latest
    container_name: noba-migration
    restart: no
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/noba
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?DB_USER must be set}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - noba-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  jwtdata:
    driver: local
  caddydata:
    driver: local
  caddyconfig:
    driver: local

networks:
  noba-network:
    driver: bridge
