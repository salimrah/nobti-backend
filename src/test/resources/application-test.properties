# Test profile configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/noba_test
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=create-drop

# Redis (use embedded or mock in tests)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT (v2)
security.jwt.access-token-ttl-seconds=3600
security.jwt.refresh-token-ttl-days=7
security.jwt.issuer=https://api.noba.ma

# Legacy v1 JWT config (UNUSED)
# jwt.secret=test-jwt-secret-key-must-be-at-least-256-bits-long
# jwt.access-token-validity-ms=3600000
# jwt.refresh-token-validity-ms=86400000

# Disable external services
otp.providers.sms.active=none
otp.providers.whatsapp.active=none

# Disable Flyway in tests
spring.flyway.enabled=false

# Identity v2 config
security.pii.secret-b64=${SECURITY_PII_SECRET_B64:K8X9CtXhOM9jyZ6q4JY2gSxUbnrS2ZZGxyYsClGKUz8=}
security.jwt.key-rotation-hours=24

# Logging
logging.level.ma.noba=DEBUG
logging.level.org.hibernate.SQL=DEBUG
