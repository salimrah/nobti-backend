# Test profile configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/noba_test
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=create-drop

# Redis (use embedded or mock in tests)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT (v2)
security.jwt.access-token-ttl-seconds=3600
security.jwt.refresh-token-ttl-days=7
security.jwt.issuer=https://api.noba.ma

# Legacy v1 JWT config (UNUSED)
# jwt.secret=test-jwt-secret-key-must-be-at-least-256-bits-long
# jwt.access-token-validity-ms=3600000
# jwt.refresh-token-validity-ms=86400000

# Use in-memory OTP senders (a real SmsGateway/WhatsAppGateway bean is required to wire the OTP service)
otp.providers.sms.active=log
otp.providers.whatsapp.active=log

# Disable Flyway in tests
spring.flyway.enabled=false

# Scheduled jobs are not coordinated in tests (create-drop schema has no shedlock table)
shedlock.enabled=false

# Identity v2 config
# Dummy, clearly test-only PII key (NOT a real secret). Tests override this at runtime.
security.pii.secret-b64=${SECURITY_PII_SECRET_B64:bm9iYS10ZXN0LWtleS1kby1ub3QtdXNlLXByb2QhISE=}
security.jwt.key-rotation-hours=24

# RabbitMQ (test placeholders)
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Rate limiting — effectively disabled for integration tests (a single test JVM/IP issues many
# requests within one window, which would otherwise trigger 429s mid-suite).
otp.rate.limit.max-requests=100000
otp.rate.limit.window-minutes=1
rate-limit.limits.[default].maxRequests=100000
rate-limit.limits.[default].windowSeconds=60
rate-limit.limits.[/api/v1/auth].maxRequests=100000
rate-limit.limits.[/api/v1/queues].maxRequests=100000
rate-limit.limits.[/api/v1/providers].maxRequests=100000

# Logging
logging.level.ma.noba=DEBUG
logging.level.org.hibernate.SQL=DEBUG
