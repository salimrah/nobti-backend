spring.config.activate.on-profile=staging

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/noba}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# HikariCP
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:15}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:3}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Redis
redis.enabled=true
spring.data.redis.url=${SPRING_DATA_REDIS_URL:redis://localhost:6379}

# Quartz (JDBC for staging)
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO

# Logging
logging.level.ma.noba=DEBUG
logging.level.org.springframework.security=INFO

# Sentry
sentry.dsn=${SENTRY_DSN:}
sentry.traces-sample-rate=${SENTRY_TRACE_RATE:0.5}
sentry.environment=staging

# JWT (v2)
security.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL:3600}
security.jwt.refresh-token-ttl-days=${JWT_REFRESH_TOKEN_TTL:7}
security.jwt.issuer=${JWT_ISSUER}
security.jwt.key-rotation-hours=${JWT_KEY_ROTATION_HOURS:24}

# PII encryption key
security.pii.secret-b64=${SECURITY_PII_SECRET_B64}

# App
app.base-url=${APP_BASE_URL}

# Rate Limiting (relaxed vs prod)
rate-limit.limits.default.maxRequests=${RATE_LIMIT_DEFAULT:200}
rate-limit.limits.default.windowSeconds=60
rate-limit.limits./api/v1/auth.maxRequests=${RATE_LIMIT_AUTH:50}
rate-limit.limits./api/v1/auth.windowSeconds=60

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Distributed Tracing (enabled in staging)
management.tracing.enabled=${TRACING_ENABLED:true}
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.5}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# External services (enabled in staging)
otp.providers.sms.active=${OTP_SMS_PROVIDER:none}
otp.providers.whatsapp.active=${OTP_WHATSAPP_PROVIDER:none}
email.provider=${EMAIL_PROVIDER:none}
