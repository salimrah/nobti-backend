spring.config.activate.on-profile=dev

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/noba}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Redis
spring.data.redis.url=${SPRING_DATA_REDIS_URL:redis://localhost:6379}

# RabbitMQ (local dev defaults — never use guest/guest outside local dev)
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Quartz (memory for dev)
spring.quartz.job-store-type=memory

# Logging
logging.level.ma.noba=DEBUG
logging.level.org.springframework.security=DEBUG

# Sentry (disabled in dev)
sentry.dsn=

# JWT (v2)
security.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL:3600}
security.jwt.refresh-token-ttl-days=${JWT_REFRESH_TOKEN_TTL:7}
security.jwt.issuer=${JWT_ISSUER:http://localhost:8080}
security.jwt.key-rotation-hours=${JWT_KEY_ROTATION_HOURS:24}

# PII encryption key
security.pii.secret-b64=${SECURITY_PII_SECRET_B64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}

# App
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
